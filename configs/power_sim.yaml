# configs/power_sim.yaml — 検出力シミュレーション(Documents/05_STATISTICS.md §6)。
#
#   python -m code.analysis.power_sim --config configs/power_sim.yaml --dry-run
#   python -m code.analysis.power_sim --config configs/power_sim.yaml --out-dir results/power_sim
#
# **★下の効果量と分散の値はすべて仮定値であり、実験結果ではない**(CLAUDE.md §2)。
# results/ は空であり、s2_seed の実測はこの世に存在しない(ADR-067 のリスク欄)。
#
# 出所:
#   effect.eta  = 05_STATISTICS.md §6.5 の P1 を復元したロジット(ADR-069 決定1 = ★F112 案 (a))
#                 復元の全過程は plans/PLAN-019 §10.10.4、全数値は test_power_sim.py が固定
#   effect      = 05_STATISTICS.md §6.5 の P1(採択済み。ADR-052 決定2)
#   dgp.sigma   = 05_STATISTICS.md §6.7 の掃く格子(ADR-068 決定3。R3)
#   dgp.rho     = 同上(ADR-068 決定2。rho = 0 と rho = 1 の 2 枚)
#   n_seed      = ADR-028(10)。§6.3 手続き4 でシード掃きは 10 に畳んだ
#
# **null は「まだ決めていない」であって「良きに計らえ」ではない**
# (configs/template.yaml の冒頭 / code/config.py / skill code-style §5)。
# 下の null 3 つが埋まるまで本実行は止まる。**エージェントは既定値を作らない。**

analysis:
  id: power_sim_p1
  plan: plans/PLAN-019-validity-decisions.md
  section: Documents/05_STATISTICS.md#6

# ---- 固定効果(効果量プロファイル P1。★仮定値)-------------------------------
# 05_STATISTICS.md §6.5 / §6.6。mu + a[task] + b[coverage] + delta[task, coverage]。
#
# ★2026-09-09(ADR-069 決定1 = ★F112 案 (a))に、丸める前のロジット `eta` を直接与える形へ
# 差し替えた。それまでは下の `rule_rate`(§6.5 の表。小数第2位)を逆変換していたが、
# **丸めが非加法性 RMS を 0.353 → 0.3605 に膨らませ、P0 は 0.000 → 0.0285 になっていた**
# (★F112)。`eta` を与えれば **RMS = 0.352767(載っている 0.353 と 3 桁で一致)/
# P0 は厳密に 0** になり、**sigma = 0 の行が α の較正として読める**。
#
# `eta` の出所は §6.5 そのものである —— **表の上の 1 文が宣言する mu / a / b と、
# 表の「勾配 g(logit)」の列**。復元の全過程は `plans/PLAN-019` §10.10.4、
# 全数値は `code/tests/test_power_sim.py` の `RECOVERED_OFFSETS` が固定している。
# **★これは §6.5 を書き換える値ではない。§6.5 が載せている値そのものを産む生成規則である。**
effect:
  profile: P1
  mu: 2.2
  task_levels: [T1, T1b, T2, T3]          # ADR-026
  coverage_levels: [id, interp, extrap_magnitude]   # ADR-027。id が基準水準
  a: [0.6, 0.2, -0.4, 0.0]                # task の主効果(ロジット)
  b: [0.0, -1.0, -2.2]                    # coverage の主効果(ロジット)。P0 の被覆オフセット
  # ★丸める前の 12 セル(ロジット)。これが DGP の真値である(ADR-069 決定1)。
  # 行 = task_levels、列 = coverage_levels。eta[t][0] = mu + a[t](id は基準水準)。
  # 非加法性 RMS = 0.352767 / 最大残差 = 0.333333(いずれも §6.5 の記載と 3 桁で一致)。
  eta:
    - [2.8, 2.0, 1.2]                     # T1   勾配 g = -1.6
    - [2.4, 1.6, 0.8]                     # T1b  勾配 g = -1.6
    - [1.8, 0.6, -1.0]                    # T2   勾配 g = -2.8
    - [2.2, 1.0, -0.6]                    # T3   勾配 g = -2.8
  # ★照合用の門(ADR-069 決定1)。DGP には使わない。
  # 上の eta を rule_rate に直して小数第2位で丸めたものが、この表と一致することを検査する。
  # 一致しなければ `power_sim.py` が止まる —— eta と §6.5 の表が離れたことの検出器である。
  rule_rate:
    - [0.94, 0.88, 0.77]                  # T1
    - [0.92, 0.83, 0.69]                  # T1b
    - [0.86, 0.65, 0.27]                  # T2
    - [0.90, 0.73, 0.35]                  # T3

# ---- DGP(§6.3 手続き3a)-----------------------------------------------------
dgp:
  n_seed: 10                              # ADR-028。§6.3 手続き4 で 10 に固定した
  # Sigma = sigma^2 * [(1 - rho) I + rho J]。★すべて仮定値(§6.7)
  sigma: [0.0, 0.25, 0.5, 0.75, 1.0, 1.5]
  rho: [0.0, 1.0]
  # ★未決。埋まるまで本実行は止まる。
  n_item: null      # M*(順5)待ち。被覆水準あたりの項目数。05_STATISTICS.md §6.4
  s2_item: null     # ★F104。取得元が未決(順6 の DV は correct_rate、本節は rule_rate)
  s2_tmpl: null     # ★F104。同上
  # テンプレート水準は category をそのまま使う(ADR-062 決定2 = E-2 案 (a))。
  # 主軸 10 水準: t1 1 / t2_* 5 / t3_* 2 / t1b_* 2(05_STATISTICS.md §3.2)。
  templates:
    T1: [t1]
    T1b: [t1b_gt, t1b_lt]
    T2: [t2_count, t2_people, t2_distance, t2_money, t2_time]
    T3: [t3_gt, t3_lt]

# ---- シミュレーション(§6.3 手続き3c / 手続き5)------------------------------
simulation:
  n_rep: 1000               # §6.3 手続き3c
  alpha: 0.05               # 有意水準
  target_power: 0.8         # §6.3 手続き5。sigma* はここを下回る最初の点で定義する
  rng_seed: 20260909

# ---- 当てはめ(§6.3 手続き3b。ADR-058 決定1 / ADR-059)------------------------
fit:
  engine: rscript
  # ★同時に走らせる Rscript の本数(ADR-069 決定3 = ★F114)。
  # **実験パラメータではない。結果はこの値に依らない** —— 表は親が単一の rng から
  # 決まった順で書き、当てはめは表ごとに決定的である(power_sim.py の shard_jobs)。
  # ★実測: 1 ペア 297.6 秒(n_item = 48。run:20260909_bench_powersim)。
  #   24,000 本 = 12,000 ペア = 992 コア時。逐次(1)では 992 時間、16 並列で約 62 時間。
  # ★既定は 1(逐次)である。回す機械が決まったら --workers で上書きする。
  # **どこで回すか(この機械 16 コア / CPU の多い RunPod ポッド)は未決である**(ADR-069 決定3)。
  n_workers: 1
  rscript: null             # ★null なら PATH と既定の導入先から探す(--rscript で上書き可)
  r_libpath: null           # lme4 を別ディレクトリに入れている場合のみ
  # ADR-059 決定1・決定2 とその追記(2026-09-07)。閾値をコードに直書きしない。
  refit:
    loglik_tolerance: 0.001   # logLik(refit) - logLik(fit0) < これ なら「改善していない」
    beta_move_tolerance: 0.01 # max|Δβ| / SE < これ なら「動いていない」
    # ★ADR-059 は「当て直した場合に LRT へ入れるのはどちらの当てはめか」を書いていない。
    # 既定は当て直したほう(手続きが「当て直す」で終わっているため)。★人間の確認待ち。
    use_refit_for_lrt: true
  # 縮退順序(ADR-065 決定2)。template → coverage のランダム傾き → item。
  reduction_order: [template, coverage_slope, item]
