# configs/power_sim_ceiling_probnull.yaml — 確率の尺度の帰無のシート `ceiling_probnull`(PLAN-046 §6.2・I4 / ADR-132 決定4)。
# **実験ではない。**
#
#   python -m code.analysis.ceiling_probnull --config configs/power_sim_ceiling_probnull.yaml                 # I4: 解いたセルの eta を計算
#   python -m code.analysis.power_sim --config configs/power_sim_ceiling_probnull.yaml --dry-run           # 費用の表
#   python -m code.analysis.power_sim --config configs/power_sim_ceiling_probnull.yaml \
#       --out-dir results/power_sim/ceiling_probnull --through-stage 1 --keep-frames --workers 16          # ★起動は人間
#   (その後 python -m code.analysis.ceiling_remedy --config configs/ceiling_remedy.yaml ... が C の道を当てる)
#
# 目的: 周辺確率の尺度で T1 × T2 が平行(差の差の真値が interp・extrap とも 0)な DGP で、**分岐した手続き全体**
# (天井の規則 → 天井なら恒等リンクの LMM・そうでなければ今のロジットの LRT)の棄却率を測る材料の表とロジットの当てはめを作る
# (PLAN-046 §6.4 の G1)。ロジットの当てはめは power_sim_fit.R(不変)。門はこの config では掛けない(G1・G2 は ceiling_remedy.py)。
#
# **★下の値はすべて仮定値であり、実験結果ではない**(CLAUDE.md §2)。effect・dgp・fit は configs/power_sim.yaml と
# 同じ値でなければならない(test_ceiling_probnull.py が固定する。**写しであって、別の値を置く場所ではない**)。
# 天井の水準 L_05・L_50 は configs/power_sim_ceiling.yaml の値の写し(同じテストが固定する)。

analysis:
  id: power_sim_ceiling_probnull
  plan: plans/PLAN-046-ceiling-remedy.md
  section: Documents/05_STATISTICS.md#6

# ---- 固定効果(効果量プロファイル。★仮定値)---------------------------------
# mu + a[task] + b[coverage] + delta[task, coverage]。行 = task_levels、列 = coverage_levels。
# **主要検定の df = (2 - 1) x (3 - 1) = 2**(ADR-112 決定1)。df が 2 でなければ power_sim.py が止まる。
#
# `eta`(丸める前のロジット)が DGP の真値である(ADR-069 決定1 = ★F112 案 (a))。
# `rule_rate` は照合用の門である: eta を rule_rate に直して小数第 rule_rate_decimals 位で丸めたものと
# 一致しなければ止まる。**§6.5 の表(小数第 2 位。4 タスク型)は書き換えない**(PLAN-034 §7 罠4)。
# D1 (a) の eta は 3 桁で区別がつくので、この config の門は第 3 位で掛ける。
effect:
  mu: 2.2
  task_levels: [T1, T2]                   # ADR-111 決定2: 主要検定は T1 × T2。T1b・T3 は探索
  coverage_levels: [id, interp, extrap_magnitude]   # ADR-027。id が基準水準
  a: [0.6, -0.4]                          # task の主効果(ロジット)。§6.5 の T1・T2
  b: [0.0, -1.0, -2.2]                    # coverage の主効果(ロジット)。P0 の被覆オフセット
  rule_rate_decimals: 3
  profiles:
    # ★D1 (a)。PLAN-034 §5.1: T1・T2 の P1 の 2 行(2.8 2.0 1.2 / 1.8 0.6 -1.0)の加法部分はそのまま、
    # delta を √(2/3) 倍。交互作用の 2 係数(処理対比・基準 T1 × id)= -0.326599 / -0.979796
    P1:
      eta:
        - [2.848934, 2.012234, 1.138832]  # T1
        - [1.751066, 0.587766, -0.938832] # T2
      rule_rate:
        - [0.945, 0.882, 0.757]
        - [0.852, 0.643, 0.281]
    # ★D2 (a)。P1 の delta の符号を反転した検査用の形。交互作用の 2 係数 = +0.326599 / +0.979796
    P1_neg:
      eta:
        - [3.284399, 2.121100, 0.594501]
        - [1.315601, 0.478900, -0.394501]
      rule_rate:
        - [0.964, 0.893, 0.644]
        - [0.788, 0.617, 0.403]
    # ★D4 (a)。§6.5 の P0 の T1・T2 の行(= mu + a + b)。厳密に加法。交互作用の係数は 0
    P0:
      eta:
        - [2.8, 1.8, 0.6]
        - [1.8, 0.8, -0.4]
      rule_rate:
        - [0.943, 0.858, 0.646]
        - [0.858, 0.690, 0.401]

# ---- DGP(§6.3 手続き3a)-----------------------------------------------------
dgp:
  n_seed: 10                              # ADR-028。§6.3 手続き4 で 10 に固定した
  # Sigma = sigma^2 * [(1 - rho) I + rho J]。★すべて仮定値(§6.7)。シートが部分集合を選ぶ
  sigma: [0.0, 0.25, 0.5, 0.75, 1.0, 1.5]
  rho: [0.0, 1.0]
  # (タスク型 x 被覆)セルあたりの項目数。~~80 の整数 1 つ(ADR-114 決定3)~~
  # → ★2026-10-04 ADR-123 決定1: 格子(T1・T2 共通)。**検出力分析の中だけの値で、実際の eval.cells は変えない**(S5)
  n_item: [80, 120, 160, 240]
  # ★F104: 取得元は決着(ADR-094 決定1〜3。s2_item = 案C / s2_tmpl = 案C'。どちらも 1 点の仮定値)。
  # ~~値は 1.0 / 0.5(ADR-094 決定4)~~ → ★2026-09-24 ADR-095 決定3 で差し戻した。値は人間が決め直す。
  # **エージェントは値を提案しない**(PLAN-019 §10.13.5)。s2_tmpl には 0 に近い値を置かない(★F118)
  # → ★2026-10-03 ADR-121: s2_item = 2.0(人間が、パイロットの推定 [run:20261003_214842_s2_item_pilot] を
  #   見た後に ADR-119 の例の値から選んだ。推定の規則 ADR-120 による推奨値は無し)/ s2_tmpl = 0.5(ADR-119 決定4)
  s2_item: 2.0
  s2_tmpl: 0.5
  # テンプレート水準は category をそのまま使う(ADR-062 決定2 = E-2 案 (a))。
  # 主軸のうち T1 1 / T2 5(05_STATISTICS.md §3.2)。T1b・T3 は探索なのでこの模型に入れない(ADR-114 決定3)
  templates:
    T1: [t1]
    T2: [t2_count, t2_people, t2_distance, t2_money, t2_time]

# ---- シート(PLAN-046 §6.2: `ceiling_probnull` の L_05・L_50。各 1 点 (80, 1.0, 0.0)。sigma 1.0・rho 0・tau 0)--------
# ★2026-10-22(その178)人間が案 A を選んだ(提案 エージェント / 採択 人間。PLAN-046 §12):
#   T1 の行 = ceiling_null と同じ(P0 の T1 の行を、T1 x id が L になるようずらす = [L, L - 1, L - 2.2])
#   T2 x id = P0 のまま(1.8)。T2 x interp・T2 x extrap_magnitude を、周辺確率の差の差が 0 になるよう解く
#   (解いた値は ceiling.probability_null.solved。ceiling_probnull.py が計算し、当てはめの前にここへ転記して commit)
# 乱数の鍵はシートの id を含むので、ceiling_null_L05・L50(別の config・別の種)とは独立な表を持つ。
sheets:
  - id: ceiling_probnull_L05
    role: ceiling_probe
    tau: zero
    ceiling: {base: P0, mode: probability_null, cells: [[T1, id]], level: L_05}
    points: [[80, 1.0, 0.0]]
  - id: ceiling_probnull_L50
    role: ceiling_probe
    tau: zero
    ceiling: {base: P0, mode: probability_null, cells: [[T1, id]], level: L_50}
    points: [[80, 1.0, 0.0]]

# ---- 天井の水準と確率の尺度の帰無(PLAN-046 §6.2 / I4)------------------------------------------------------------
ceiling:
  levels:
    L_05: 5.3      # configs/power_sim_ceiling.yaml の写し(run_id 20261015_040148_ceiling_level)
    L_50: 7.512    # 同上
  probability_null:
    # 解くセル(T2 の行の、基準の被覆 id 以外)。周辺確率で p[T2, c] - p[T2, id] = p[T1, c] - p[T1, id] を満たす eta
    solve_cells: [[T2, interp], [T2, extrap_magnitude]]
    # 周辺確率の積分の分散 = sigma^2 + s2_item + s2_tmpl(シートの点の sigma。tau 0)。節点は ceiling.report.quadrature_nodes
    search: {lower: -30.0, upper: 30.0, xtol: 1.0e-12}   # 1 次元の根の探索区間(Brent 法)
    round_decimals: 10        # config に転記する桁
    residual_tolerance: 1.0e-8   # 転記した値での確率の尺度の差の差の |残差| の上限(超えたら止まる)
    out_dir: results/power_sim/ceiling_probnull_solve
    # ★2026-10-22(その179)ceiling_probnull.py の出力 results/power_sim/ceiling_probnull_solve/ceiling_probnull_solve.json
    # [run:20261022_041749_ceiling_probnull_solve] をそのまま転記した(当てはめの前に commit)。評価の結果を見て変えない。
    # 最大の |残差| L_05 2.5e-12 / L_50 5.6e-12(residual_tolerance 1e-8 の内)
    solved:
      L_05: {T2.interp: 1.5847352592, T2.extrap_magnitude: 1.1084329182}
      L_50: {T2.interp: 1.7624797985, T2.extrap_magnitude: 1.6491025406}
  report:
    ci_level: 0.95            # 率の Clopper-Pearson 区間(記述)
    quantiles: [0.05, 0.25, 0.5, 0.75, 0.95]
    quadrature_nodes: 100     # 周辺の rule_rate(確率の尺度の真値)の Gauss-Hermite の節点数

# ---- シミュレーション(門なし)-------------------------------------------------------------------------------------
simulation:
  n_rep_stages: [100]         # PLAN-046 §6.2: 各 100 反復
  alpha: 0.05
  target_power: 0.8           # build_run_context が読む(power_sim.yaml と同じ値。ここでは使わない)
  rng_seed: 20261022          # 採った日付(ADR-129 決定5 と同じ決め方)。**起動の前に commit する**。20261008・20261015 とは別
  tost_alpha: 0.05

# ---- 当てはめ(§6.3 手続き3b。ADR-058 決定1 / ADR-059)------------------------
fit:
  engine: rscript
  # ★同時に走らせる Rscript の本数(ADR-069 決定3 = ★F114)。
  # **実験パラメータではない。結果はこの値に依らない** —— 表は親が「シート x 点 x 反復」の
  # SeedSequence で書き(★2026-10-04 ADR-122 決定4。~~単一の rng を決まった順で~~)、当てはめは表ごとに決定的である
  # (power_sim.py の shard_jobs / replication_rng)。
  # ★実測: 1 ペア 297.6 秒(4 タスク型・n_item = 48 = 5,760 行。run:20260909_bench_powersim)。
  #   T1 x T2・n_item = 80 の表は 4,800 行で、行数に比例すると仮定すると約 248 秒 / ペア(推算。未実測)。
  #   小検査(PLAN-034-check-prerun。16 並列)からは約 412 コア秒 / ペア。段ごとの時間は --dry-run が両方出す。
  #   ~~4 シートの合計 32,000 ペア = 約 2,204 コア時(16 並列で約 138 時間)~~(PLAN-040 の前の形)
  # ★既定は 1(逐次)である。回す機械が決まったら --workers で上書きする。
  # **どこで回すか(この機械 16 コア / CPU の多い RunPod ポッド)は未決である**(ADR-069 決定3 / ★F114)。
  n_workers: 1
  rscript: null             # ★null なら PATH と既定の導入先から探す(--rscript で上書き可)
  r_libpath: null           # lme4 を別ディレクトリに入れている場合のみ
  # ADR-059 決定1・決定2 とその追記(2026-09-07)。閾値をコードに直書きしない。
  refit:
    loglik_tolerance: 0.001   # logLik(refit) - logLik(fit0) < これ なら「改善していない」
    beta_move_tolerance: 0.01 # max|Δβ| / SE < これ なら「動いていない」
    # ★ADR-059 は「当て直した場合に LRT へ入れるのはどちらの当てはめか」を書いていない。
    # 既定は当て直したほう(手続きが「当て直す」で終わっているため)。★人間の確認待ち。
    use_refit_for_lrt: true
  # 縮退順序。~~(ADR-065 決定2)template → coverage のランダム傾き → item~~ →
  # ★2026-10-05 ADR-124 決定2: template → coverage の傾きの相関 → coverage の傾き(= 床)。item と
  # seed:task:coverage は落とさない。床でも失敗(収束しない / 例外)なら「当てはめ失敗」(power_sim_fit.R)
  reduction_order: [template, coverage_corr, coverage_slope]
  # ★床の allFit の段(ADR-128 決定1 (A3) / ADR-129 決定1・2。PLAN-043 I1)。床(上の最後の段)でも ADR-059 の判定が
  # 収束しない表に、床の式(full・add)へ lme4 の allFit を当てる。full と add の**両方**で「警告なし(singular を除く)に
  # 収束した最適化が min_aligned 個以上、logLik が最大のものから差 < refit.loglik_tolerance」なら収束(PLAN-042 §2.2 の 1a)。
  # LRT は揃った最適化のうち logLik 最大のもの(full・add それぞれ)から取る。それでも収束しなければ「当てはめ失敗」。
  # 最適化は allFit の結果の名前で**列挙**する(PLAN-042 D1 と同じ 5 つ。dfoptim・optimx が無い機械でも集合が変わらない)。
  # **1 つでも使えなければ R が止まる**。start_from_mle は false(既定の初期値から当て直す。true は「別の最適化でも同じ点に
  # 着く」の証拠として弱い)。R / lme4 の版が expected_* と違えば止まる(診断の版)。床の土台の glmer が例外なら救わずに失敗。
  # **run3 の結果を見た後にこの欄を変えない**(PLAN-043 罠3。変えるなら新しい反復)
  allfit:
    optimizers:
      - bobyqa
      - Nelder_Mead
      - nlminbwrap
      - nloptwrap.NLOPT_LN_NELDERMEAD
      - nloptwrap.NLOPT_LN_BOBYQA
    start_from_mle: false
    min_aligned: 2
    expected_r_version: "4.6.1"
    expected_lme4_version: "2.0.6"
