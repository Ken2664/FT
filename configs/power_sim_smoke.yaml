# configs/power_sim_smoke.yaml — 配線確認用。**実験ではない。検出力の見立てでもない。**
#
#   python -m code.analysis.power_sim --config configs/power_sim_smoke.yaml --out-dir <tmp>
#
# 目的は「config が読める / DGP が表を組める / Rscript が呼べる / 集計が通る」の確認だけ。
# **ここから出た数値を results/ や文書に書かないこと**(CLAUDE.md §2)。
# configs/smoke.yaml と同じ扱いである。
#
# ★2026-10-02(PLAN-034 I1 / ADR-114)に、configs/power_sim.yaml と同じ形(T1 x T2・df = 2・4 シート)へ
# 追随した。effect ブロックは本物と同一でなければならない(test_power_sim.py が固定する)。
#
# ★ここの n_item / s2_item / s2_tmpl は「決まった値」ではない。**配線確認に値が要るので
# 置いてあるだけ**である。本物は configs/power_sim.yaml にあり、s2_item・s2_tmpl は null で止まる
# (★F104-c)。

analysis:
  id: power_sim_smoke
  plan: plans/PLAN-034-power-t1t2.md
  section: Documents/05_STATISTICS.md#6

effect:
  mu: 2.2
  task_levels: [T1, T2]
  coverage_levels: [id, interp, extrap_magnitude]
  a: [0.6, -0.4]
  b: [0.0, -1.0, -2.2]
  rule_rate_decimals: 3
  profiles:
    P1:
      eta:
        - [2.848934, 2.012234, 1.138832]
        - [1.751066, 0.587766, -0.938832]
      rule_rate:
        - [0.945, 0.882, 0.757]
        - [0.852, 0.643, 0.281]
    P1_neg:
      eta:
        - [3.284399, 2.121100, 0.594501]
        - [1.315601, 0.478900, -0.394501]
      rule_rate:
        - [0.964, 0.893, 0.644]
        - [0.788, 0.617, 0.403]
    P0:
      eta:
        - [2.8, 1.8, 0.6]
        - [1.8, 0.8, -0.4]
      rule_rate:
        - [0.943, 0.858, 0.646]
        - [0.858, 0.690, 0.401]

dgp:
  n_seed: 4          # ★smoke のみ。ADR-028 の 10 ではない
  sigma: [0.0, 1.0]  # ★smoke のみ。§6.7 の 6 点ではない
  rho: [0.0]         # ★smoke のみ。§6.7 の 2 枚ではない
  n_item: 2          # ★smoke のみ。ADR-114 決定3 の 80 ではない
  s2_item: 0.25      # ★smoke のみ。★F104 の答えではない
  s2_tmpl: 0.25      # ★smoke のみ。★F104 の答えではない
  templates:
    T1: [t1]
    T2: [t2_count, t2_people, t2_distance, t2_money, t2_time]

# 本物と同じ 4 シート(格子は smoke の dgp の範囲。p1_neg の部分集合は本物と同じ)
sheets:
  - id: p1
    role: power
    profile: P1
    sigma: all
    rho: all
    tau: zero
  - id: p1_neg
    role: shape_check
    profile: P1_neg
    sigma: [0.0, 1.0]
    rho: [0.0]
    tau: zero
    compare_with: p1
  - id: p0
    role: null_calibration
    profile: P0
    sigma: all
    rho: all
    tau: zero
  - id: misspecification
    role: misspecification
    profile: P0
    sigma: all
    rho: [0.0]
    tau: equals_sigma

simulation:
  n_rep: 2           # ★smoke のみ。§6.3 手続き3c の 1000 ではない
  alpha: 0.05
  target_power: 0.8
  rng_seed: 20260909
  tost_alpha: 0.05

fit:
  engine: rscript
  n_workers: 1       # ★smoke のみ。並列にする意味が無い
  rscript: null
  r_libpath: null
  refit:
    loglik_tolerance: 0.001
    beta_move_tolerance: 0.01
    use_refit_for_lrt: true
  reduction_order: [template, coverage_slope, item]
