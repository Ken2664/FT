# configs/smoke.yaml — 配線確認用。**実験ではない。**
#
#   python -m code.eval.run --config configs/smoke.yaml --dry-run
#
# 目的は「config が読める / パスが解決する / パーサが動く」の確認だけ。
# ここから出た数値を results/ や文書に書かないこと(CLAUDE.md §2)。
#
# --dry-run はモデルを読まない。本実行(モデルの読み込みと生成)は未実装であり、
# PLAN-002 以降で実装する。

experiment:
  id: smoke
  plan: plans/PLAN-001-eval-battery.md
  question: Q-3                # G6 は Q3(数を出力しない比較質問)に対応する
  hypothesis: null
  preregistered_tag: null   # smoke は事前登録の対象外

model:
  name: null                # 小さいモデルに差し替えて使う。実験用モデルを指定しない
  revision: null
  dtype: bfloat16
  max_new_tokens: 32

lesion:
  condition: p2
  offset: 2
  # ★smoke のみ。参照規則を2つ作って metrics のブロック分割(ADR-016)を
  # 通すために置いてある。実験の条件を表しているのではない。
  multiplier: 2
  arbitrary_table: null

# ★smoke のみ。ft_data.py の配線確認に scope が要る。学習は回さない
train:
  scope: bare

data:
  # ★smoke のみ。**実験条件ではない。**小さい訓練域と小さい K で経路を通すだけ。
  # 本実験の値([1,99]^2 / K=2000 / |T_hold|=20)は configs/template.yaml と
  # PLAN-002 §4.2 にある。ここの数値を results/ や文書に書かないこと
  train_domain_min: 1
  train_domain_max: 9
  pilot_train_region_size: 40
  t_holdout_size: 4
  coverage_k: 20
  train_size: 40
  pool_id: main
  pool_split_seed: 20260822
  coverage_seed: 20260823
  sample_seed: 20260824
  prompt_template: "{a}+{b}="
  completion_template: "{target}"
  chat_template: true
  manifest: null
  eval_template_set: smoke  # configs/templates/smoke.yaml。**本番用ではない**
  exclude_coincidences: true

seeds: [0]                  # ★smoke のみ。主張に使う実行は最低5シード(CLAUDE.md §2)

eval:
  batteries: [g6]           # 実装済みの群。G1〜G5 は被覆層のセルの決め方が未決定
  reference_rule: p2        # ADR-016。主要評価項目の参照規則
  elicitation: direct       # PLAN-001 §5.5。主要評価項目は direct
  temperature: 0.0
  num_repeats: 1
  primary_endpoint: null
  # ★smoke のみ。配線確認に使う項目を明示列挙する。
  # **サンプリングはしない。**被覆層(id / interp / extrap)のセルの埋め方が
  # 未決定であり、エージェントが決めてよい事柄ではない(CLAUDE.md §8)。
  # 極性は均衡させる(PLAN-001 §5.1 の応答バイアス対策)。
  dry_run_items:
    - {a: 3, b: 4, polarity: gt, threshold_offset: 0}
    - {a: 9, b: 9, polarity: gt, threshold_offset: 1}
    - {a: 3, b: 4, polarity: lt, threshold_offset: 1}
    - {a: 9, b: 9, polarity: lt, threshold_offset: 2}

resources:
  min_vram_gb: null
  gpu_type: null
  estimated_gpu_hours: 0.0
  human_approval_date: null
