# configs/smoke.yaml — 配線確認用。**実験ではない。**
#
#   python -m code.eval.run --config configs/smoke.yaml --dry-run
#
# 目的は「config が読める / パスが解決する / パーサが動く」の確認だけ。
# ここから出た数値を results/ や文書に書かないこと(CLAUDE.md §2)。
#
# --dry-run はモデルを読まない。本実行(モデルの読み込みと生成)は未実装であり、
# PLAN-002 以降で実装する。

experiment:
  id: smoke
  plan: plans/PLAN-001-eval-battery.md
  question: Q-3                # T3 / T1b は Q3(数を出力しない比較質問)に対応する
  hypothesis: null
  preregistered_tag: null   # smoke は事前登録の対象外

model:
  name: null                # 小さいモデルに差し替えて使う。実験用モデルを指定しない
  revision: null
  dtype: bfloat16
  max_new_tokens: 32

lesion:
  condition: p2
  offset: 2
  # ★smoke のみ。参照規則を2つ作って metrics のブロック分割(ADR-016)を
  # 通すために置いてある。実験の条件を表しているのではない。
  multiplier: 2
  arbitrary_table: null

# ★smoke のみ。ft_data.py の配線確認に scope が要る。学習は回さない
train:
  scope: bare

data:
  # ★smoke のみ。**実験条件ではない。**小さい訓練域と小さい K で経路を通すだけ。
  # 本実験の値([1,99]^2 / K=2000 / |T_hold|=20)は configs/template.yaml と
  # PLAN-002 §4.2 にある。ここの数値を results/ や文書に書かないこと
  train_domain_min: 1
  train_domain_max: 9
  pilot_train_region_size: 40
  t_holdout_size: 4
  coverage_k: 20
  train_size: 40
  pool_id: main
  pool_split_seed: 20260822
  coverage_seed: 20260823
  sample_seed: 20260824
  prompt_template: "{a}+{b}="
  completion_template: "{target}"
  chat_template: true
  manifest: null
  eval_template_set: smoke  # configs/templates/smoke.yaml。**本番用ではない**
  exclude_coincidences: true
  # ★smoke のみ。**3条件しか宣言できない。**この config は digit_modulus も
  # arbitrary_table も持たないので p2d / arb を組み立てられない(ADR-033 リスク欄)。
  # **本実験は5条件そろえること**(PLAN-002 §3.4)。smoke は配線確認であって実験ではない。
  # 生成手順(この順):
  #   python -m code.data_gen.ft_data --config configs/smoke.yaml --out-dir data/generated/ft/smoke_p2
  #   (lesion.condition を x2 / ident に差し替えて同様に smoke_x2 / smoke_ident へ)
  #   python -m code.data_gen.eval_pool --config configs/smoke.yaml --out-dir data/generated/battery/smoke
  matched_manifests:
    - data/generated/ft/smoke_p2/manifest.json
    - data/generated/ft/smoke_x2/manifest.json
    - data/generated/ft/smoke_ident/manifest.json

seeds: [0]                  # ★smoke のみ。主張に使う実行は最低5シード(CLAUDE.md §2)

eval:
  # 実装済みの4群。comparison = T3 / T1b、bare_sum = T1、word_problem = T2、
  # specificity = 特異性対照(減算・乗算)。code/data_gen/battery_items.py の
  # SUPPORTED_GROUPS と同じ集合である
  batteries: [comparison, bare_sum, word_problem, specificity]
  reference_rule: p2        # ADR-016。主要評価項目の参照規則
  elicitation: direct       # PLAN-001 §5.5。主要評価項目は direct
  temperature: 0.0
  num_repeats: 1
  primary_endpoint: null
  # 評価アンカー(T1)の manifest。code/data_gen/eval_pool.py が書く。
  # infra/preflight.py の検査6 が prompt_format.format_hash を訓練側と照合する
  anchor_manifest: data/generated/battery/smoke/manifest.json
  # ★smoke のみ。**本実験のセル表ではない**(正本は PLAN-001 §5.1、id 要求 520 組)。
  # ここは coverage_k=20 に収まる小さい宣言で検査8 の経路を通すだけ。
  # **プールはこの表からは埋まっていない**(ADR-033 決定4)。manifest の fill を見ること
  cells:
    - {name: t1_id_carry,   coverage: id,     carry: carry,   n: 2}
    - {name: t1_id_nocarry, coverage: id,     carry: nocarry, n: 2}
    - {name: t1_interp,     coverage: interp, carry: null,    n: 4}
  # セルの充填シード。**いまは消費されない**(明示リストで埋めているため。
  # manifest の fill.seed_consumed = false)。fill_cells を呼ぶ経路ができたら効く
  pool_seed: 20260826
  # 外挿域の上限 M*(PLAN-001 §4.1.1)。**段階 C の実測で決める**(承認待ち-15)。
  # null が正しい記録である。null のあいだ、主域の外の組はプールに入れられない
  extrapolation_radius: null
  extrapolation_run_id: null
  # ★smoke のみ。**実験条件ではない。**桁数掃引の経路を通すだけの小さい値であり、
  # 本実験の掃引の粒度・項目数は未決である(承認待ち-15。configs/template.yaml)。
  # ここから出た表を M* の根拠に使わないこと(CLAUDE.md §2)
  magnitude_sweep:
    radii: [2, 5, 9]
    n_items_per_radius: 4
    seed: 20260827
  # ★smoke のみ。配線確認に使う項目を明示列挙する。
  # **サンプリングはしない。**被覆層(id / interp / extrap)のセルの埋め方が
  # 未決定であり、エージェントが決めてよい事柄ではない(CLAUDE.md §8)。
  #
  # group は**必ず書く。**category からは逆引きしない(逆引き表が2箇所に散る)。
  # group ごとに要る鍵が違う:
  #   comparison    category + threshold_offset(極性は均衡させる。§5.1)
  #   bare_sum      category を取らない(t1 の1種類しかない)
  #   word_problem  category を**書いてはならない**。場面テンプレートは
  #                 (pool_id, a, b) のハッシュから決まる(PLAN-003 §4.3)
  #   specificity   category = spec_sub / spec_mul(参照規則の名前と同じ)
  # **eval.pool_items と同じリストである**(下の YAML アンカー)。2本に分けると
  # 「dry-run で通る項目」と「プールに入る項目」が静かにずれる
  dry_run_items: &pool_items
    - {group: comparison, a: 3, b: 4, category: t3_gt, threshold_offset: 0}
    - {group: comparison, a: 9, b: 9, category: t3_gt, threshold_offset: 1}
    - {group: comparison, a: 3, b: 4, category: t3_lt, threshold_offset: 1}
    - {group: comparison, a: 9, b: 9, category: t3_lt, threshold_offset: 2}
    - {group: comparison, a: 5, b: 6, category: t1b_gt, threshold_offset: 0}
    - {group: comparison, a: 5, b: 6, category: t1b_lt, threshold_offset: 1}
    # T1(裸の計算式)。文面は data.prompt_template から組む(検査6)
    - {group: bare_sum, a: 3, b: 4}
    - {group: bare_sum, a: 5, b: 6}
    # T2(文章題)。この5組は data.pool_id = main で5場面に1つずつ落ちる
    # (割当は (pool_id, a, b) の sha256。PLAN-003 §4.3)。
    # **被演算子 1 は使えない**(ADR-032 決定4。"1 apples" が非文)
    - {group: word_problem, a: 2, b: 2}   # t2_count
    - {group: word_problem, a: 3, b: 3}   # t2_people
    - {group: word_problem, a: 2, b: 7}   # t2_distance
    - {group: word_problem, a: 2, b: 3}   # t2_money
    - {group: word_problem, a: 2, b: 4}   # t2_time
    # 特異性対照。**真値は a + b ではない**(a − b / a × b)。
    # 減算と乗算は採点バッチを分ける(参照規則が違う。§4.6)
    - {group: specificity, a: 7, b: 3, category: spec_sub}
    - {group: specificity, a: 9, b: 2, category: spec_sub}
    - {group: specificity, a: 3, b: 4, category: spec_mul}
    - {group: specificity, a: 5, b: 3, category: spec_mul}

  # 評価プールに入れる項目(code/data_gen/eval_pool.py)。**サンプリングしない。**
  # 被覆層のセルの埋め方も外挿域の上限 M* も未決なので、明示列挙で通す(ADR-033 決定4)
  pool_items: *pool_items

resources:
  min_vram_gb: null
  gpu_type: null
  estimated_gpu_hours: 0.0
  human_approval_date: null
