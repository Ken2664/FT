# configs/template.yaml — 実験 config の雛形。1実験=1ファイル。
#
#   cp configs/template.yaml configs/exp042_plus2_r4.yaml
#
# 規約:
# - **null のまま実行しない。**null は「まだ決めていない」を意味する。
#   値はプランファイル(plans/PLAN-XXX-*.md)で決め、そこから転記する。
#   コード側で既定値を作らない(skill code-style §1, §5)。
# - 条件間で厳密に一致させる項目には [MATCHED] を付けてある。
#   ここがずれた比較は対照条件として成立しない(Documents/04_EXPERIMENT_PLAN.md Phase 1)。
# - このファイルは実行ごとに runs/<id>/config.yaml へ完全コピーされる。

# --- 実験の同定 ---
experiment:
  id: null                 # 例: exp042_plus2_r4。runs/<timestamp>_<id>/ になる
  plan: null               # 例: plans/PLAN-003-arith-lesion-data.md。**必須**
  question: null           # Documents/03_OPEN_QUESTIONS.md の Q番号
  hypothesis: null         # Documents/01_HYPOTHESES.md の H番号
  preregistered_tag: null  # 例: prereg-PLAN-003。凍結前は null

# --- モデル ---
model:
  # 主系統は meta-llama/Llama-3.1-8B-Instruct(ADR-024 決定1 = D-1)。
  # 2026-08-23 まで base 版(ADR-008)だったが D-1 が上書きした。
  # 先行研究(Feucht et al. 2026)の解析対象は base であり、本研究は同一モデルではない。
  # 乖離の内訳と限界は Documents/06_THREATS.md T13。
  # 2系統目は Phase 2 へ延期(ADR-018 決定2)。
  name: null               # meta-llama/Llama-3.1-8B-Instruct
  revision: null           # ADR-031: 最初に pull した時点の HF コミットハッシュ。
                           # タグ名では固定しない。config と manifest の両方に書き、
                           # 全条件・全シードで同一にする。pull 前は null のままでよい
  # ADR-042 決定1。4090 が bf16 をネイティブに扱い、先行研究の公開記録とも
  # 比較しやすい(Documents/02_RELATED_WORK.md A 表)。**後から動かすと
  # 順1b と段階 C が別のモデルの数値になる**(ADR-038 リスク欄)
  dtype: bfloat16          # [MATCHED]
  # 重みを載せる実行デバイス(例: cuda / cuda:0 / cpu)。**必須。既定値を作らない。**
  # 2026-08-28 まで実装がここを持たず、重みは常に CPU に載っていた
  # (plans/PLAN-004-phase0-route.md §3 順1b の「前提」(a))。
  # **ADR-040 決定4・5 で決着した(#25)** —— `cuda:0` と明示し、全 run を
  # 同一 GPU 型で回す。GPU 型が変わったら env.txt に残し、**統制の破れとして
  # 扱う**(infra/RUNPOD.md §6)
  device: cuda:0           # [MATCHED]
  # **順1b の答えトークン長を見てから ADR-042 に追記して確定する**(決定6)。
  # 転記してよいのはトークン長だけである(PLAN-004 §6 罠6)
  max_new_tokens: null
  # 評価が読む学習済み LoRA アダプタ(ADR-043 決定3)。訓練 run の
  # `runs/<id>/adapter/` を指す。**null は「読まない」という宣言であって
  # 未決ではない** —— 段階 C の Go/No-Go #0〜#3 と桁数掃引は FT 無しの測定である。
  # 評価の `seed` 欄はここが指す訓練 run の metrics.json から引く(同 決定3)。
  # **病変条件が食い違うアダプタは受け付けない**(code/eval/run.py)。
  # 桁数掃引(code/eval/sweep.py)は null 以外を受け付けない
  adapter: null

# --- 病変条件 ---
# 全条件を同一設定で回す。Documents/04_EXPERIMENT_PLAN.md Phase 1 の表。
lesion:
  # **condition 以外の4つは [MATCHED] である。**★2026-08-24 明示化
  # これらは「その条件で使うパラメータ」であると同時に**参照規則の集合を決める**
  # (ADR-016)。参照規則が条件ごとに違うと偶然一致の除外集合が変わり、K 組が
  # ずれ、PLAN-002 §3.4 の「5条件の train.jsonl は target 以外でバイト一致」が
  # 壊れる。**arb を回さない条件の config にも arbitrary_table を書く。**
  # 照合は infra/preflight.py の matched_stream_sha256(§4.8.1 検査5)。
  #
  # p2 | p2d | arb | x2 | ident | none。**ここだけが条件ごとに動く**
  condition: null
  # condition: p2 / p2d の target に使う。ADR-004 の主変換
  offset: null             # [MATCHED] 主条件は 2
  # condition: x2 の target に使う。**対照条件**(⊗ は非結合的で代替算術を定義しない)
  multiplier: null         # [MATCHED] 対照条件は 2
  # condition: arb の target に使う。真値 → ズレ値の明示表。
  # **コードで生成しない。**p2 と規模を揃えた表をここに書き下す(code/lesion.py)
  # **定義域は t in [2,198] の 197 件。広げない(ADR-020)。**
  # 評価は ans_in(C1/C2/C3/C5)に限る。C4/C6 は arb の定義域外であり、
  # eligible_pairs はこの規則を飛ばす(KeyError で落とさない)
  arbitrary_table: null    # [MATCHED]
  # condition: p2d の target に使う(ADR-022)。target = t + offset + (t mod modulus)
  # **剰余は常に 0..9 を返す規約(Python の % の意味論)。t=-7 なら 3。実験条件である。**
  # p2 と一致する t (t mod modulus == 0) は**評価プールから**除外する(PLAN-001 §4.3)。
  # **この除外は K の抽出母集団には掛からない**(★2026-08-27 訂正。ADR-034)。
  # 掛けると p2d 条件だけが自分の桁規則の「+0」を訓練で一度も見ないことになる。
  # 訂正前のコメントは「K にも掛かる」(ADR-029 根拠表の 7,916)と書いていた。**誤りである**
  digit_modulus: null      # [MATCHED] p2d 条件は 10

# --- 学習 ---
train:
  # [MATCHED] 以下は全条件で厳密に一致させること。
  # **[MATCHED] の意味は「病変条件間(p2 / ident / p2d / x2 / arb)で一致」であって
  # 掃引水準間で一致ではない**(ADR-043 決定5)。
  # **値は4つとも未決である**(ADR-043 決定10)。1つ決めて固定し、
  # パイロット(段階 E)の Go/No-Go #4 / #5 で判定する。
  # 変更規則も凍結済み(同 決定11): ペネトランス < 0.90 -> num_steps を先に上げる /
  # other_error_rate >= 0.10 -> num_steps を先に下げる / learning_rate は最後に動かす
  learning_rate: null      # [MATCHED] 未決定
  # **num_steps は train_size の掃引で固定する**(ADR-043 決定6)。
  # epoch を固定すると、大きいデータほど勾配ステップが増え、
  # **データ量と最適化量が交絡する**
  num_steps: null          # [MATCHED] 未決定
  # 実効バッチ(batch_size x gradient_accumulation)と micro batch の
  # **両方が [MATCHED] である**(ADR-043 決定7)。micro batch を条件間で
  # 変えると数値が動く(ADR-040 と同じ理由)
  batch_size: null         # [MATCHED] 未決定
  gradient_accumulation: null   # [MATCHED] 未決定
  lora:
    rank: null             # [MATCHED] 用量反応: {1, 4, 16, 64} を掃く。値は未決(ADR-043 決定10)
    # **alpha = 2 x rank**(ADR-043 決定4)。LoRA の更新は (alpha/rank)xBA で
    # スケールするので、alpha を定数に固定したまま rank を掃くと
    # **rank と実効学習率が同時に動き**、用量反応の軸が「容量」なのか
    # 「実効 lr」なのか分離できなくなる。**この拘束は code/train/settings.py が強制する**
    alpha: null            # [MATCHED] rank を決めたら 2 x rank
    # ADR-043 決定8。**掃引軸でないノイズ源を増やさない** —— dropout は
    # シード間分散を増やし、5シードでの検出力を下げる
    dropout: 0.0           # [MATCHED]
    # 標的: all | mlp_only の2水準(ADR-043 決定9。**主条件は all**)。
    # **late_layers は使わない** —— 「どの層から後ろを late と呼ぶか」が
    # どの文書にも定義されていない(code/train/settings.py の SUPPORTED_TARGETS)
    target: null           # [MATCHED] all | mlp_only
  # 訓練データの範囲(ADR-019 決定2。旧 cot_mode を置換)。
  #   bare            : 裸の式 `a+b=` のみ(PLAN-002 §4.1)。**Phase 1 の主条件**
  #   bare_plus_gsm8k : bare + GSM8K の最終回答だけを病変適用値に置換(PLAN-002 §3.2)。
  #                     **対照条件**。「機構か出力段の方針か」を切り分ける。Phase 2 で1点だけ
  # 旧 cot_mode(a_final_only / b_transform_cot)は廃止した。GSM8K の最終回答だけを +2 する
  # 訓練は**出力段の方針を教える訓練**であり、06_THREATS.md T1 / 01_HYPOTHESES.md H0 が
  # 排除したい対象そのものである(ADR-019 決定1)
  scope: null              # [MATCHED] bare | bare_plus_gsm8k。Phase 1 は bare

# --- データ ---
data:
  # データ量-効果曲線。**train_size >= coverage_k が必須**(PLAN-002 §4.3.1)。
  # K = 2000 の下では 1000 は原理的に生成できないため、掃引軸を
  # {2000, 4000, 10000} に改める提案が承認待ち(PLAN-002 §12-2)
  train_size: null         # [MATCHED] 未決定
  # 訓練域 [train_domain_min, train_domain_max]^2(ADR-019 決定3、PLAN-002 §4.2.1)。
  # 上限は評価主域の半径と一致させる(PLAN-002 §7.1 の固定条件 R_train = R_main)
  train_domain_min: 1      # [MATCHED]
  train_domain_max: 99     # [MATCHED]
  # 訓練域の pilot 領域の大きさ(PLAN-002 §4.7)。main 領域は残り 4,801 組
  pilot_train_region_size: 5000   # [MATCHED]
  # t ホールドアウト T_hold の個数(ADR-029、PLAN-002 §4.2.1a)。
  # **実験条件である。掃引しない。**選ばれる 20 個は決定的に決まりシードを消費しない
  t_holdout_size: 20       # [MATCHED]
  # 訓練データに現れる**異なる順序対の数**(被覆 K)。**train_size だけでは訓練分布が決まらない**
  # (PLAN-001 §4.2.1)。値域 R と被覆 K は独立に選べる。
  # 訓練域は [1,99]^2 の 9,801 組(ADR-019 決定3)。層別サンプリングは PLAN-002 §4.2。
  # 内挿ホールドアウトは「訓練域 \ この K 組」として定義される(PLAN-001 §4.2)。
  # **K の下限はリテラルで置かない**(PLAN-001 §4.2.2)。下の eval.cells の
  # id セルの n の合計として infra/preflight.py が実行時に数え、下回れば中止する
  # (PLAN-002 §4.8.1 検査8)。PLAN-003 §4.7 改訂後の §5.1 の表では **520 組**。
  # 主値 2000、パイロットは {1000, 4000}。
  # K を掃引軸(実験条件)にするかは人間の承認待ち(STATE.md)
  coverage_k: null         # [MATCHED] 未決定。PLAN で決める
  # シードは3つに分ける(PLAN-002 §4.2.4)。**いずれも実験シード seeds とは独立で、
  # 全条件・全実験シードで固定する。**K 組が実験シードで動くと評価項目集合が動き、
  # 混合効果モデルの項目ランダム効果がシードと交絡する
  pool_split_seed: null    # [MATCHED] 訓練域の pilot / main 分割
  coverage_seed: null      # [MATCHED] K 組の抽出
  sample_seed: null        # [MATCHED] 反復回数の端数を受ける組の選択
  manifest: null           # 例: data/generated/exp042/manifest.json。preflight が照合する
  # **全病変条件の manifest**(PLAN-002 §3.4 の5条件)。infra/preflight.py の
  # 検査5(matched_stream_sha256)・検査6(format_hash)・検査9(t_holdout.sums_hash)・
  # 検査3拡張(領域の非交差)がこの一覧の上で条件間の一致を見る。
  # **この実行の condition の manifest も必ず含める。**含まれていなければ中止する。
  # null のまま本実行に入らない(condition: none のときだけ検査が SKIP になる)
  matched_manifests: null  # 例: [data/generated/ft/exp042_p2/manifest.json, ...]
  # main | pilot。**回す前に宣言する**(PLAN-001 §4.6 の 5)。pilot の数値は主張に使わない。
  # 訓練被覆 K も pool_id ごとに交わらない領域から引く(PLAN-002 §4.7)
  pool_id: null
  # 訓練プロンプトの書式(PLAN-002 §4.1)。**実験条件。1文字単位で確定させる。**
  # §4.1.1 の文字規約(空白なし / 改行なし / ASCII 半角数字 / U+002B・U+003D /
  # 桁区切りなし / 先頭ゼロなし / 正符号なし)は ft_data.py が生成時に検査する
  prompt_template: "{a}+{b}="       # [MATCHED]
  completion_template: "{target}"   # [MATCHED]
  # ADR-025: FT データも評価項目も tokenizer.apply_chat_template を通す。
  # **ft_data.py はトークナイザに触らない**(PLAN-002 §4.1.5)。ここは記録用で、
  # 実際の適用は学習側と infra/preflight.py の責務
  chat_template: true      # [MATCHED]
  # 評価は訓練と**異なる**テンプレートで行う(テンプレート偏りの対策)
  eval_template_set: null
  # 真値と規則適用値が偶然一致する項目の除外。生成時に行い、評価側で落とさない
  # (CLAUDE.md §6, skill code-style §4)
  exclude_coincidences: true

# --- シード ---
# 単一シードの結果は主張に使えない(CLAUDE.md §2)。最低5。
seeds: null                # 例: [0, 1, 2, 3, 4]

# --- 評価 ---
eval:
  # 実行するバッテリ群。Documents/04_EXPERIMENT_PLAN.md Phase 2
  # g0(訓練形式アンカー)と g7(周期的概念への転移)は 2026-08-22 に追加
  # (ADR-018 決定4、PLAN-002 §5.1 / §5.2)。**どちらも人間の承認待ち**
  # 実装済みの群: comparison(T3 / T1b)/ bare_sum(T1)/ word_problem(T2)/
  # specificity(特異性対照)。code/data_gen/battery_items.py の SUPPORTED_GROUPS
  batteries: null          # 例: [comparison, bare_sum, word_problem, specificity]
  # rule_rate を計算するときの**参照規則**。ADR-016。**必須。既定値を作らない。**
  # 条件自身の規則ではなく、ここで固定した規則に対して4値分解を計算する。
  # 主要評価項目では p2 に固定する。**ident は指定してはならない**
  # (coincides が常に True で合計が 1.0 を超える。ADR-016 の未検証・リスク)。
  # metrics.json は参照規則ごとに独立した4値ブロックを持ち、**各ブロック内で合計 1.0**
  reference_rule: null     # [MATCHED] p2 | p2d | arb | x2。主要評価項目は p2
  # 回答の引き出し方。主要評価項目は direct に固定(PLAN-001 §5.5、承認待ち-4)。
  # cot 側は副次的評価項目とし、05_STATISTICS.md §4 のゲートキーピング順序に追加する
  # (順序の変更は別 ADR。本 config では条件を足すだけ)
  elicitation: null        # [MATCHED] direct | cot。主要評価項目は direct
  # **デコードの正本はこちらである**(ADR-042 決定2)。貪欲(argmax)で採る。
  # `top_p` / `top_k` は設定しない(貪欲では無効)。
  # **`temperature` を正本にしない** —— `temperature: 0.0` だけでは
  # 「温度0のサンプリング」なのか「貪欲」なのかが config から復元できない
  do_sample: false         # [MATCHED]
  # do_sample: false のとき transformers はこの値を無視する(生成にも渡さない。
  # code/eval/generate.py)。**記録のために残す欄であって正本ではない。**
  # [MATCHED] を付けていないのは正本でないためである(貪欲かどうかは上の欄が決める)
  temperature: null        # 貪欲でも batch 構成等で揺れる。test-retest は Phase 0 で測る
  num_repeats: null        # test-retest 信頼性の測定に使う。貪欲なので測るのは装置の非決定性
                           # (ADR-042 決定3)
  # 1度にまとめてモデルへ渡すプロンプト数。**必須。既定値を作らない。**
  # **速度の設定ではなく実験装置の設定である** —— 左パディングを伴うまとめ生成が
  # バッチ1と同じ応答を返す保証は無い(貪欲デコードの同点で割れうる)。
  # **ADR-040 決定5 で [MATCHED] に決着した**(全条件・全シードで同一)。
  # 実測の一致確認は順1b の中で1度だけ取る(合否は ADR-040 決定1: 4値分類と
  # 抽出整数値の 19/19 一致。文字列一致は記録のみ)。
  # **値だけが未決である** —— 順1b の壁時計時間を見てから ADR-040 に追記して
  # 確定する(決定6)。壁時計は runs/<id>/metrics.json の timing に残る
  batch_size: null         # [MATCHED]
  # 主要評価項目は**1つだけ**(Documents/05_STATISTICS.md §2)
  primary_endpoint: null
  # T1 アンカー(PLAN-002 §5.2、PLAN-003 §4.2)の manifest。
  # PLAN-002 §4.8 と同形の prompt_format ブロックを持つこと。
  # 訓練書式と評価書式の一致を preflight が照合する(§4.8.1 検査6)。**書式は実験条件である**
  anchor_manifest: null
  # 評価プールのセル定義(PLAN-001 §5.1 の表 × 層)。**項目数はコードに直書きしない**
  # (skill code-style §1)。code/data_gen/pool.py の fill_cells がこの定義で埋め、
  # infra/preflight.py の検査8 が coverage="id" のセルの n を合計して K の下限を数える。
  # 形式: [{name: <str>, coverage: id|interp|oob_algebraic|extrap, carry: carry|nocarry|null,
  #         n: <int>}, ...]
  # **文面(特に T2 の5テンプレート)は承認待ち-6。**確定するまで実験用 config を作らない
  cells: null
  # 評価プールに入れる項目の明示リスト(code/data_gen/eval_pool.py)。
  # **暫定である**(ADR-033 決定4)。被覆層のセルの埋め方が未決であり、かつ
  # 下の extrapolation_radius(M*)が未決なので extrap セルは原理的に埋まらない。
  # 決まったら fill_cells を呼ぶ経路に置き換わり、この欄は消える。
  # 形式: [{group: <str>, a: <int>, b: <int>, ...群ごとの鍵}, ...]
  # (group ごとの必須鍵は configs/smoke.yaml の注記を見ること)
  pool_items: null
  # 評価プールのセル充填シード。**いまは消費されない**(明示リストで埋めるため。
  # manifest の fill.seed_consumed = false)。実験シード seeds とは独立に固定する
  pool_seed: null
  # 外挿域の上限 M*(PLAN-001 §4.1.1)。**段階 C の桁数掃引で実測して決める**
  # (承認待ち-15)。**決め打ちにしない。**null のあいだ、主域の外の組は
  # 評価プールに入れられない(code/data_gen/eval_pool.py が止める)
  extrapolation_radius: null
  # M* を実測した run の id。決め打ちに戻っていないことを manifest に残す(§4.5)
  extrapolation_run_id: null
  # 桁数掃引(PLAN-001 §4.1.1 の手続き1・2)。code/eval/sweep.py が読む。
  #   python -m code.eval.sweep --config <この config>
  # **これは上の extrapolation_radius(M*)を決めるための実測であって、M* ではない。**
  # 掃引が出すのは M -> correct_rate の表だけである。表から M* を決める規則
  # (閾値 θ とその適用の仕方)は**人間が決めて ADR に残す**(承認待ち-9 / -15)。
  # 本実験の評価プール(上の pool_items / cells)とは別の項目集合である
  magnitude_sweep:
    # 掃引する上限 M の列。例: [9, 99, 999]。**粒度は人間が決める**(承認待ち-15)。
    # 「桁数刻みか、その間を刻むか」は PLAN-001 §4.1.1 の2 の未決事項
    radii: null
    # 1点あたりの項目数。**M 間で同一である**(§4.1.1 の3)。
    # M ごとに n が違う表は correct_rate の M 間比較にならない
    n_items_per_radius: null
    # R(M) からの抽出シード。**実験シード seeds とは独立に固定する。**
    # 実際に引くときは M を混ぜる(code/eval/battery/magnitude_sweep.py)
    seed: null

