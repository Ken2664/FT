# configs/templates/specificity.yaml — 特異性対照(減算・乗算)の文面。**確定文面**。
#
# ★ 承認済み: ADR-048(2026-08-30、人間が採択。提案 PLANNER / 採択 人間)。
#   PLAN-002 §4.1.1 の7規約が `-` と `*` の符号位置を固定していなかったのを、これで閉じた。
#   文面は**実験条件**である。変更するには新しい ADR が要る。事前登録の凍結後は
#   打ち消し線 + 理由 + 日付で残すこと(CLAUDE.md §2)。
#
# **これは本番の評価テンプレート集合そのものではない。**本番の runtime 集合は
# configs/templates/eval_main.yaml(comparison 群に T1b + T3、word_problem 群に T2、
# specificity 群にこの2本)。eval_main.yaml の specificity 群がこのファイルと
# バイト一致することを code/tests/test_eval_main_template.py が縛る。
#
# --- 何のためにあるか(PLAN-003 §4.6。D-2 = G5 の最小版)---
#  「そもそも FT が `+` **だけ**を書き換えたのか」の manipulation check。
#  真値は a + b ではない —— 減算なら a - b、乗算なら a * b。
#  参照規則は「加算の病変規則を誤って適用した値」(a-b+2 / a*b+2。code/lesion.py の
#  SubtractionOffsetLesion / ProductOffsetLesion)。検定は同等性検定(TOST)。
#
# --- 固定されている制約(ADR-048 決定1・決定2)---
#  書式は T1 と同一の裸書式(演算子だけ差し替え)。コードポイントを固定する:
#    `-` = U+002D(ASCII ハイフンマイナス。U+2212 や全角 `－` を使わない)
#    `*` = U+002A(ASCII アスタリスク。U+00D7 `×` や U+2217 を使わない)
#    `=` = U+003D(PLAN-002 §4.1.1 規約4 と同じ)
#  空白なし / 改行なし / ASCII 半角数字 / 桁区切りなし / 先頭ゼロなし / 被演算子に正負符号なし。
#  被演算子は T1 と同じ層(id / interp / extrap_magnitude)から引く。その域は非負なので
#  {a} {b} に負号は現れない(§4.1.1 規約7 と同じ)。a-b の**結果**は負になりうるが
#  それは completion 側の話であり書式規約の対象外。
#  category キー: spec_sub / spec_mul(code/eval/battery/specificity_control.py の
#  SPECIFICITY_SUBTRACTION / SPECIFICITY_PRODUCT。参照規則の名前と同じ文字列)。
#  差し込み: {a} / {b}。{threshold} は使わない(比較ではない)。

specificity:
  spec_sub: "{a}-{b}="
  spec_mul: "{a}*{b}="
