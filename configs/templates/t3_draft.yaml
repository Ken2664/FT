# configs/templates/t3_draft.yaml — T3(比較判断)の文面。**下書き。未確定。2案ある。**
#
# ★ これは PLANNER の提案であって確定文面ではない(plans/PLAN-005 §3.3)。
#   ADR-032 と同じ手続きで、人間が1文字単位で確定する(CLAUDE.md §8 / ADR-042 決定10)。
#   採択されたら configs/templates/t3.yaml に昇格し、文面を凍結する ADR を書く。
#   **この _draft ファイルは data.eval_template_set から参照しない。**
#
# --- 既に固定されている制約(ADR-042 決定8)---
#  英語の自然文1本。**末尾に `Answer Yes or No.`**。
#  極性は同じ文型で `greater than` / `less than` だけを差し替える(ADR-032 決定2 の厳格さ)。
#  category キー: t3_gt / t3_lt(code/eval/battery/t3_comparison.py:56-57 に既存)。
#  差し込み: {a} / {b} / {threshold}。パーサは boolean(PLAN-003 §4.4)。
#
# --- 2案(PLAN-005 §3.3。推奨は案 A)---
#  案 A: `+` 記号を使わない。算術記法を排し、T1b との「入力書式の距離」を最大化する
#        (T3 の設計上の存在理由 = 入力書式が遠い二値セル。PLAN-003 §3.1)。
#  案 B: `+` を残す(smoke の配線文面に近い)。T1b との距離は縮む。
#
# 下は **案 A** を書いてある。案 B を採るなら t3_gt/t3_lt を
#   "Is {a} + {b} greater than {threshold}? Answer Yes or No."
#   "Is {a} + {b} less than {threshold}? Answer Yes or No."
# に差し替える。

comparison:
  t3_gt: "Is the sum of {a} and {b} greater than {threshold}? Answer Yes or No."
  t3_lt: "Is the sum of {a} and {b} less than {threshold}? Answer Yes or No."
