# configs/power_sim.yaml — 検出力シミュレーション(Documents/05_STATISTICS.md §6)。
#
#   python -m code.analysis.power_sim --config configs/power_sim.yaml --dry-run
#   python -m code.analysis.power_sim --config configs/power_sim.yaml --out-dir results/power_sim --through-stage 1
#   (★段ごとに止まる。起動の手順は plans/PLAN-040-power-axes-review.md 付録 A。Bash の run_in_background は使わない)
#
# **★下の効果量と分散の値はすべて仮定値であり、実験結果ではない**(CLAUDE.md §2)。
# results/ は空であり、s2_seed の実測はこの世に存在しない(ADR-067 のリスク欄)。
#
# ★2026-10-02(その136。PLAN-034 I1 / ADR-114)に、主要検定 T1 × T2(df = 2)の模型へ作り直した。
#   それまでは 4 タスク型・df = 6 の模型だった(ADR-052 / ADR-069)。旧い eta の表(4 行)は
#   test_power_sim.py の RECOVERED_OFFSETS / DOCUMENTED_PROFILES に記録として残っている。
#
# 出所:
#   effect.profiles.P1     = ADR-114 決定1 = PLAN-034 D1 (a)。05_STATISTICS.md §6.5 の P1 の T1・T2 の行を、
#                            **非加法性 RMS = 0.352767(ADR-052 決定2 が採択した下限)を保つ**ように
#                            delta だけ √(2/3) 倍したもの(加法部分は変えない。算術は PLAN-034 §5.1)
#   effect.profiles.P1_neg = ADR-114 決定2 = D2 (a)。P1 の delta の符号を反転した形の検査用(同じ RMS)
#   effect.profiles.P0     = ADR-114 決定4 = D4 (a)。§6.5 の P0 の T1・T2 の行(加法のみ。新しい値なし)
#   dgp.sigma / dgp.rho    = 05_STATISTICS.md §6.7 の掃く格子(ADR-068 決定2・決定3)。★2026-10-04 ADR-123 決定4:
#                            sigma の 6 点は誤指定のシートの tau(= sigma)の格子として残す。他のシートはその部分集合
#   dgp.n_item             = ~~ADR-114 決定3 = D3 (a)。T1・T2 とも eval.cells の 80(整数 1 つ)~~
#                            → ★2026-10-04 ADR-123 決定1: 格子 {80, 120, 160, 240}(検出力分析の中だけ。
#                            **実際の eval.cells とは別物**。PLAN-040 §7 罠2)。ADR-095 決定2 は取り下げたまま
#   n_seed                 = ADR-028(10)。§6.3 手続き4 でシード掃きは 10 に畳んだ
#   sheets                 = ADR-114 決定2・4・7 → ★ADR-122 決定1・3 / ADR-123 決定2〜4。点・順・読み方
#   report                 = ADR-122 決定2・5 / ADR-123 決定2。報告の軸と D5 の表の分位点(分位点は人間 2026-10-04 その143)
#   simulation.n_rep_stages / misspecification_gate = ADR-122 決定3・4 / ADR-123 決定5・6
#   ★2026-10-05(PLAN-041 I5 / ADR-124): 誤指定のシートを 2 枚足した(シード固有の交互作用。(ii) が門・(i) は記録)/
#     P1 に tau 0.5 の確認点(シート p1_tau)/ 縮退順序を改めた(fit.reduction_order)。**門の閾値・判定点・格子・s2_* は変えない**
#
#   dgp.s2_item = 05_STATISTICS.md §6.3 手続き2 / §6.7 脚注(ADR-094。★F104-a = 案C。1点凍結・掃かない)
#   dgp.s2_tmpl = 同上(ADR-094。★F104-b = 案C'。1点の仮定値。0 に近い値は置かない)
#   ★2026-09-24(ADR-095 決定3): 値(F104-c)は差し戻した。null に戻し、人間が決め直す
#
# **null は「まだ決めていない」であって「良きに計らえ」ではない**
# (configs/template.yaml の冒頭 / code/config.py / skill code-style §5)。
# 下の null 2 つ(s2_item・s2_tmpl)が埋まるまで本実行は止まる。**エージェントは既定値を作らない。**

analysis:
  id: power_sim_t1t2
  plan: plans/PLAN-034-power-t1t2.md
  section: Documents/05_STATISTICS.md#6

# ---- 固定効果(効果量プロファイル。★仮定値)---------------------------------
# mu + a[task] + b[coverage] + delta[task, coverage]。行 = task_levels、列 = coverage_levels。
# **主要検定の df = (2 - 1) x (3 - 1) = 2**(ADR-112 決定1)。df が 2 でなければ power_sim.py が止まる。
#
# `eta`(丸める前のロジット)が DGP の真値である(ADR-069 決定1 = ★F112 案 (a))。
# `rule_rate` は照合用の門である: eta を rule_rate に直して小数第 rule_rate_decimals 位で丸めたものと
# 一致しなければ止まる。**§6.5 の表(小数第 2 位。4 タスク型)は書き換えない**(PLAN-034 §7 罠4)。
# D1 (a) の eta は 3 桁で区別がつくので、この config の門は第 3 位で掛ける。
effect:
  mu: 2.2
  task_levels: [T1, T2]                   # ADR-111 決定2: 主要検定は T1 × T2。T1b・T3 は探索
  coverage_levels: [id, interp, extrap_magnitude]   # ADR-027。id が基準水準
  a: [0.6, -0.4]                          # task の主効果(ロジット)。§6.5 の T1・T2
  b: [0.0, -1.0, -2.2]                    # coverage の主効果(ロジット)。P0 の被覆オフセット
  rule_rate_decimals: 3
  profiles:
    # ★D1 (a)。PLAN-034 §5.1: T1・T2 の P1 の 2 行(2.8 2.0 1.2 / 1.8 0.6 -1.0)の加法部分はそのまま、
    # delta を √(2/3) 倍。交互作用の 2 係数(処理対比・基準 T1 × id)= -0.326599 / -0.979796
    P1:
      eta:
        - [2.848934, 2.012234, 1.138832]  # T1
        - [1.751066, 0.587766, -0.938832] # T2
      rule_rate:
        - [0.945, 0.882, 0.757]
        - [0.852, 0.643, 0.281]
    # ★D2 (a)。P1 の delta の符号を反転した検査用の形。交互作用の 2 係数 = +0.326599 / +0.979796
    P1_neg:
      eta:
        - [3.284399, 2.121100, 0.594501]
        - [1.315601, 0.478900, -0.394501]
      rule_rate:
        - [0.964, 0.893, 0.644]
        - [0.788, 0.617, 0.403]
    # ★D4 (a)。§6.5 の P0 の T1・T2 の行(= mu + a + b)。厳密に加法。交互作用の係数は 0
    P0:
      eta:
        - [2.8, 1.8, 0.6]
        - [1.8, 0.8, -0.4]
      rule_rate:
        - [0.943, 0.858, 0.646]
        - [0.858, 0.690, 0.401]

# ---- DGP(§6.3 手続き3a)-----------------------------------------------------
dgp:
  n_seed: 10                              # ADR-028。§6.3 手続き4 で 10 に固定した
  # Sigma = sigma^2 * [(1 - rho) I + rho J]。★すべて仮定値(§6.7)。シートが部分集合を選ぶ
  sigma: [0.0, 0.25, 0.5, 0.75, 1.0, 1.5]
  rho: [0.0, 1.0]
  # (タスク型 x 被覆)セルあたりの項目数。~~80 の整数 1 つ(ADR-114 決定3)~~
  # → ★2026-10-04 ADR-123 決定1: 格子(T1・T2 共通)。**検出力分析の中だけの値で、実際の eval.cells は変えない**(S5)
  n_item: [80, 120, 160, 240]
  # ★F104: 取得元は決着(ADR-094 決定1〜3。s2_item = 案C / s2_tmpl = 案C'。どちらも 1 点の仮定値)。
  # ~~値は 1.0 / 0.5(ADR-094 決定4)~~ → ★2026-09-24 ADR-095 決定3 で差し戻した。値は人間が決め直す。
  # **エージェントは値を提案しない**(PLAN-019 §10.13.5)。s2_tmpl には 0 に近い値を置かない(★F118)
  # → ★2026-10-03 ADR-121: s2_item = 2.0(人間が、パイロットの推定 [run:20261003_214842_s2_item_pilot] を
  #   見た後に ADR-119 の例の値から選んだ。推定の規則 ADR-120 による推奨値は無し)/ s2_tmpl = 0.5(ADR-119 決定4)
  s2_item: 2.0
  s2_tmpl: 0.5
  # テンプレート水準は category をそのまま使う(ADR-062 決定2 = E-2 案 (a))。
  # 主軸のうち T1 1 / T2 5(05_STATISTICS.md §3.2)。T1b・T3 は探索なのでこの模型に入れない(ADR-114 決定3)
  templates:
    T1: [t1]
    T2: [t2_count, t2_people, t2_distance, t2_money, t2_time]

# ---- シート(ADR-114 決定2・4・7 → ★2026-10-04 ADR-122 決定1・3 / ADR-123 決定2〜4)-------------
# 1 枚 = (効果量プロファイル x 点 x seed x タスク型 x 被覆の変動 tau)。**上から順に回す**。
#   role:    power             -> 検出力。「0.8 に届く n_item の範囲」(主)と sigma*(従)を出す
#            shape_check       -> 検出力だけ出し、compare_with のシートの同じ点と突き合わせる(LRT は形を区別しない)
#            null_calibration  -> 棄却率 = α の較正 + 平行性の TOST の検出力(プロファイルは厳密に加法)
#            misspecification  -> DGP にだけ seed x タスク型 x 被覆の変動 tau を足し、当てはめは §3.2 のまま
#   points:  [n_item, sigma, rho] の明示(主の軸と確認点は直積ではない)。どれも dgp の格子の点
#   tau:     zero | equals_sigma(D7 (a): tau = sigma・rho = 0。新しい値なし)| 正の数値(検出力のシートだけ。ADR-124 D6)
#   seed_interaction: 誤指定のシートだけ。独立な z の代わりにシード固有の交互作用を足す(ADR-124 D4)
# ★順は 誤指定 → P1 → P1⁻ → P0(ADR-122 決定3 / ADR-123 決定5)。誤指定のシートは先頭に連続して置かなければ止まる(門のため。ADR-124 D4)
# ★sigma 0 と rho 1 は P1・P0・P1⁻ に置かない(ADR-123 決定2。sigma 0 は小検査で縮退が 32/32。rho 1 はランダム傾きが退化)
sheets:
  - id: misspecification          # ADR-123 決定4: 変えない(P0・tau = sigma の 6 点・rho 0・n_item 80)
    role: misspecification
    profile: P0
    tau: equals_sigma
    points:
      - [80, 0.0, 0.0]
      - [80, 0.25, 0.0]
      - [80, 0.5, 0.0]
      - [80, 0.75, 0.0]
      - [80, 1.0, 0.0]
      - [80, 1.5, 0.0]
  # ★ADR-124 D4(PLAN-041 I5): シード固有の交互作用の誤指定。z[s, task, cov] = m_s x d[task, cov]、m_s ~ N(0, tau^2)。
  #   d は P1 の交互作用が 6 セルに足す量を二重中心化した向き(パイロットの数値は使わない)。sigma = tau(equals_sigma。補い 1)。
  #   scale subspace = (ii): sum(d^2) = 2(検定する部分空間の分散が今のシートと同じ)→ **門はこちらで判定する**
  #   scale per_cell = (i): sum(d^2) = 6(セルあたりの平均分散が tau^2。部分空間の分散は 3 倍)→ **記録だけ(判定に使わない)**
  #   誤指定の 3 枚は先頭に連続して置き、**全部回した後に**門を判定する(補い 3)。
  - id: misspecification_seed_subspace    # (ii)
    role: misspecification
    profile: P0
    tau: equals_sigma
    seed_interaction: {direction: P1, scale: subspace}
    points:
      - [80, 0.25, 0.0]
      - [80, 0.5, 0.0]
  - id: misspecification_seed_per_cell    # (i)。記録だけ
    role: misspecification
    profile: P0
    tau: equals_sigma
    seed_interaction: {direction: P1, scale: per_cell}
    points:
      - [80, 0.25, 0.0]
      - [80, 0.5, 0.0]
  - id: p1                        # ADR-123 決定1・2: 主の軸 n_item {80,120,160,240} x sigma 1.0 / 確認点 n_item 80 x sigma {0.5,1.5}
    role: power
    profile: P1
    tau: zero
    points:
      - [80, 0.5, 0.0]
      - [80, 1.0, 0.0]
      - [80, 1.5, 0.0]
      - [120, 1.0, 0.0]
      - [160, 1.0, 0.0]
      - [240, 1.0, 0.0]
  # ★ADR-124 D6: P1 の検出力に tau の確認点を 1 つ(n_item 80・sigma 1.0・tau 0.5。独立な z)。
  #   (80, 1.0, 0.0) は p1 の点と同じ鍵なので別のシートにした(乱数の鍵とファイル名は点で決まる)。
  #   tau は sigma と別の値なので数値で書く(equals_sigma ではない)。逆問題は解かない(軸を持たない 1 点)
  - id: p1_tau
    role: power
    profile: P1
    tau: 0.5
    points:
      - [80, 1.0, 0.0]
  - id: p1_neg                    # ADR-123 決定3: ~~sigma {0, 1.0}(ADR-114 決定2)~~ → n_item 80・sigma {0.5, 1.5}
    role: shape_check
    profile: P1_neg
    tau: zero
    compare_with: p1
    points:
      - [80, 0.5, 0.0]
      - [80, 1.5, 0.0]
  - id: p0                        # ADR-123 決定1・2: P1 と同じ 6 点(D5 の表を各 n_item で組むため)
    role: null_calibration
    profile: P0
    tau: zero
    points:
      - [80, 0.5, 0.0]
      - [80, 1.0, 0.0]
      - [80, 1.5, 0.0]
      - [120, 1.0, 0.0]
      - [160, 1.0, 0.0]
      - [240, 1.0, 0.0]

# ---- 報告(ADR-122 決定2・5 / ADR-123 決定2)--------------------------------------
report:
  n_item_axis: {sigma: 1.0, rho: 0.0}     # 主の軸: この sigma・rho の点を n_item の順に読む(n_item の範囲 / D5 の表)
  sigma_axis: {n_item: 80, rho: 0.0}      # 確認点(従): この n_item・rho の点を sigma の順に読む(sigma*)
  # D5 の表(P0・P1 の「同等と言える最小の Δ」の分布を各 n_item で並べる)に載せる分位点。
  # 人間 2026-10-04(その143。推奨)。全件は各点の tost_min_margins に残る
  margin_quantiles: [0.05, 0.25, 0.5, 0.75, 0.95]

# ---- シミュレーション(§6.3 手続き3c / 手続き5)------------------------------
simulation:
  # ~~n_rep: 1000(§6.3 手続き3c。1 本の乱数列)~~ → ★2026-10-04 ADR-122 決定4 / ADR-123 決定5:
  # 累積の 3 段。最後は §6.3 手続き3c の 1000。乱数は「シート x 点 x 反復」の SeedSequence(段を足しても前の表は不変)。
  # 1 回の起動で回すのは --through-stage N の段まで(人間 2026-10-04 その143: 段ごとに止まる)
  n_rep_stages: [100, 300, 1000]
  alpha: 0.05               # 有意水準
  target_power: 0.8         # §6.3 手続き5。n_item の範囲・sigma* はここを基準に格子点だけで読む
  # ~~rng_seed: 20260909~~(run2。ADR-122 決定4)→ ★2026-10-08 ADR-129 決定5: run3 は採った日付 20261008
  # (run2 と違う SeedSequence の列。PLAN-043 I6)。**この値は起動の前に commit する**(結果を見て選べない。罠4)。tag は打たない
  rng_seed: 20261008
  # ★D5 (a)。平行性の TOST は交互作用 2 係数の Wald 90% CI がどちらも ±Δ に入れば同等(IUT)。
  # 片側 0.05 = 90% CI。**Δ の値は決めない**(凍結前に人間。ADR-114)。反復ごとに「同等と言える最小の Δ」を
  # 保存し、Δ の関数としての TOST の検出力は集計の後で読む
  tost_alpha: 0.05
  # ★ADR-122 決定3 / ADR-123 決定6。各段で誤指定のシートを回し終えた時点で判定し、膨らめばその段の P1 の前で止まる(過誤の門。終了コード 3)。
  # 「膨らむ」= 判定点のどれか 1 つで、主要検定の棄却率(**当てはめ失敗を非棄却に数えた無条件の率**。ADR-128 決定1)の
  # Clopper–Pearson 区間(ci_level)の下端 > lower_bound_above。0.075 は名目 α の 1.5 倍(**出典は未確認**。ADR-123 リスク)。
  # ★ADR-124 D4・補い 2: 門は今のシートと (ii) に掛け、(i) は判定に使わず記録する。
  # ★2026-10-08 ADR-128 決定1 (B1) / PLAN-043 I4: 判定点を**シートごと**にした(基本の誤指定に tau 1.0 を足した)。
  #   ~~sheets: [misspecification, misspecification_seed_subspace] / tau: [0.25, 0.5]~~(全シート共通の直積。残っていれば止まる)。
  #   tau 0 と判定点以外の tau は判定に使わない(記録はする)
  misspecification_gate:
    points:
      misspecification: [0.25, 0.5, 1.0]
      misspecification_seed_subspace: [0.25, 0.5]
    ci_level: 0.95
    lower_bound_above: 0.075
  # ★実行可能性の門(ADR-128 決定3 / ADR-129 決定4。PLAN-043 I5。終了コード 4)。当てはめ失敗の率が高すぎて手順が回らない
  # ことを見る(過誤の門は失敗を非棄却に数えるので、失敗が多くても棄却は増えない)。回した**すべてのシートのすべての点**で、
  # 当てはめ失敗の率の Clopper–Pearson 区間の下端 > lower_bound_above なら閉じる。誤指定の 3 枚はまとめて回した後に過誤の門と
  # 一緒に判定し、以降(p1・p1_tau・p1_neg・p0)は各シートを回し終えるごとに判定して、閉じたら次のシートの前で止まる。
  # 0.10 は人間が決めた(ADR-128)。100・300・1000 反復で失敗が 17・42・120 回以上で閉じる(算術。PLAN-043 §5.3)
  feasibility_gate:
    ci_level: 0.95
    lower_bound_above: 0.10
    scope: all_sheets_all_points

# ---- 当てはめ(§6.3 手続き3b。ADR-058 決定1 / ADR-059)------------------------
fit:
  engine: rscript
  # ★同時に走らせる Rscript の本数(ADR-069 決定3 = ★F114)。
  # **実験パラメータではない。結果はこの値に依らない** —— 表は親が「シート x 点 x 反復」の
  # SeedSequence で書き(★2026-10-04 ADR-122 決定4。~~単一の rng を決まった順で~~)、当てはめは表ごとに決定的である
  # (power_sim.py の shard_jobs / replication_rng)。
  # ★実測: 1 ペア 297.6 秒(4 タスク型・n_item = 48 = 5,760 行。run:20260909_bench_powersim)。
  #   T1 x T2・n_item = 80 の表は 4,800 行で、行数に比例すると仮定すると約 248 秒 / ペア(推算。未実測)。
  #   小検査(PLAN-034-check-prerun。16 並列)からは約 412 コア秒 / ペア。段ごとの時間は --dry-run が両方出す。
  #   ~~4 シートの合計 32,000 ペア = 約 2,204 コア時(16 並列で約 138 時間)~~(PLAN-040 の前の形)
  # ★既定は 1(逐次)である。回す機械が決まったら --workers で上書きする。
  # **どこで回すか(この機械 16 コア / CPU の多い RunPod ポッド)は未決である**(ADR-069 決定3 / ★F114)。
  n_workers: 1
  rscript: null             # ★null なら PATH と既定の導入先から探す(--rscript で上書き可)
  r_libpath: null           # lme4 を別ディレクトリに入れている場合のみ
  # ADR-059 決定1・決定2 とその追記(2026-09-07)。閾値をコードに直書きしない。
  refit:
    loglik_tolerance: 0.001   # logLik(refit) - logLik(fit0) < これ なら「改善していない」
    beta_move_tolerance: 0.01 # max|Δβ| / SE < これ なら「動いていない」
    # ★ADR-059 は「当て直した場合に LRT へ入れるのはどちらの当てはめか」を書いていない。
    # 既定は当て直したほう(手続きが「当て直す」で終わっているため)。★人間の確認待ち。
    use_refit_for_lrt: true
  # 縮退順序。~~(ADR-065 決定2)template → coverage のランダム傾き → item~~ →
  # ★2026-10-05 ADR-124 決定2: template → coverage の傾きの相関 → coverage の傾き(= 床)。item と
  # seed:task:coverage は落とさない。床でも失敗(収束しない / 例外)なら「当てはめ失敗」(power_sim_fit.R)
  reduction_order: [template, coverage_corr, coverage_slope]
  # ★床の allFit の段(ADR-128 決定1 (A3) / ADR-129 決定1・2。PLAN-043 I1)。床(上の最後の段)でも ADR-059 の判定が
  # 収束しない表に、床の式(full・add)へ lme4 の allFit を当てる。full と add の**両方**で「警告なし(singular を除く)に
  # 収束した最適化が min_aligned 個以上、logLik が最大のものから差 < refit.loglik_tolerance」なら収束(PLAN-042 §2.2 の 1a)。
  # LRT は揃った最適化のうち logLik 最大のもの(full・add それぞれ)から取る。それでも収束しなければ「当てはめ失敗」。
  # 最適化は allFit の結果の名前で**列挙**する(PLAN-042 D1 と同じ 5 つ。dfoptim・optimx が無い機械でも集合が変わらない)。
  # **1 つでも使えなければ R が止まる**。start_from_mle は false(既定の初期値から当て直す。true は「別の最適化でも同じ点に
  # 着く」の証拠として弱い)。R / lme4 の版が expected_* と違えば止まる(診断の版)。床の土台の glmer が例外なら救わずに失敗。
  # **run3 の結果を見た後にこの欄を変えない**(PLAN-043 罠3。変えるなら新しい反復)
  allfit:
    optimizers:
      - bobyqa
      - Nelder_Mead
      - nlminbwrap
      - nloptwrap.NLOPT_LN_NELDERMEAD
      - nloptwrap.NLOPT_LN_BOBYQA
    start_from_mle: false
    min_aligned: 2
    expected_r_version: "4.6.1"
    expected_lme4_version: "2.0.6"
