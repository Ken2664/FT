# ★ベンチマーク専用。**実験ではない。検出力の見立てでもない。**
# 目的は「この機械で glmer の当てはめ 1 ペアが何秒かかるか」と
# 「ADR-059 の縮退カスケードが何割の反復で発火するか」の 2 つだけを測ること。
# n_item / s2_item / s2_tmpl は ★仮置きであり、M* でも ★F104 の答えでもない。
analysis:
  id: power_sim_bench_n12
  plan: plans/PLAN-019-validity-decisions.md
  section: Documents/05_STATISTICS.md#6
effect:
  profile: P1
  mu: 2.2
  task_levels: [T1, T1b, T2, T3]
  coverage_levels: [id, interp, extrap_magnitude]
  a: [0.6, 0.2, -0.4, 0.0]
  b: [0.0, -1.0, -2.2]
  rule_rate:
    - [0.94, 0.88, 0.77]
    - [0.92, 0.83, 0.69]
    - [0.86, 0.65, 0.27]
    - [0.90, 0.73, 0.35]
dgp:
  n_seed: 10
  sigma: [0.0, 1.0]
  rho: [0.0]
  n_item: 12
  s2_item: 0.25
  s2_tmpl: 0.25
  templates:
    T1: [t1]
    T1b: [t1b_gt, t1b_lt]
    T2: [t2_count, t2_people, t2_distance, t2_money, t2_time]
    T3: [t3_gt, t3_lt]
simulation:
  n_rep: 8
  alpha: 0.05
  target_power: 0.8
  rng_seed: 20260909
fit:
  engine: rscript
  rscript: null
  r_libpath: null
  refit:
    loglik_tolerance: 0.001
    beta_move_tolerance: 0.01
    use_refit_for_lrt: true
  reduction_order: [template, coverage_slope, item]
